<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Neo LinearPad</title>
  <!-- Sends visitors to their language: the one they picked before, else Japanese when the
       browser's first language is Japanese, else English. Keeps "#get" (the app's purchase links open the download choice). -->
  <script>
    let lang = null;
    try { lang = localStorage.getItem("lang"); } catch {}
    if (lang !== "ja" && lang !== "en") {
      lang = /^ja\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "") ? "ja" : "en";
    }
    location.replace(lang + "/" + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=en/"></noscript>
  <link rel="alternate" hreflang="en" href="https://neolinearpad.com/en/">
  <link rel="alternate" hreflang="ja" href="https://neolinearpad.com/ja/">
</head>
<body>
  <p><a href="en/">Neo LinearPad (English)</a> · <a href="ja/" lang="ja">日本語</a></p>
</body>
</html>
