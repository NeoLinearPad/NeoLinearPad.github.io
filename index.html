  <title>Neo LinearPad</title>
  <meta name="description" content="A Mac app that turns off MacBook trackpad acceleration, so the pointer moves in proportion to your finger movement, at the sensitivity you choose.">
  <!-- Sends visitors to their language: the one they picked before, else Japanese when the
       browser's first language is Japanese, else English. Keeps "#get" (the app's purchase links open the download choice). -->
  <script>
    let lang = null;
    try { lang = localStorage.getItem("lang"); } catch {}
    if (lang !== "ja" && lang !== "en") {
      lang = /^ja\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "") ? "ja" : "en";
    }
    location.replace(lang + "/" + location.hash);
  </script>
